<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promty</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #141A2A;
      --bg-card: #0F1420;
      --bg-surface: #00223B;
      --accent: #2166E9;
      --danger: #C32A2A;
      --warning: #D3CD2D;
      --text-main: #FFFFFF;
      --text-muted: #8B9BB4;
      --border-white: rgba(255, 255, 255, 0.063);
    }
    body {
      margin: 0;
      padding: 0;
      width: 380px;
      height: 560px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow-x: hidden;
    }
    #root {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="popup.js"></script>
</body>
</html>
