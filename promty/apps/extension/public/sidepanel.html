<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promty</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg-main: #141a2a;
        --bg-card: #0f1420;
        --bg-surface: #00223b;
        --accent: #2166e9;
        --danger: #c32a2a;
        --warning: #d3cd2d;
        --text-main: #ffffff;
        --text-muted: #8b9bb4;
        --border-white: rgba(255, 255, 255, 0.063);
      }
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100vh;
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-main);
        overflow-x: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
